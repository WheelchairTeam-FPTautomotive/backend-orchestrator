[project]
name = "kms-backend-orchestrator"
version = "0.1.0"
description = "FastAPI API Gateway Orchestrator for Automotive Digital Cockpit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic[email]>=2.6.4",
    "requests>=2.31.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "httpx>=0.28.1",
    "boto3>=1.43.61",
    "python-dotenv>=1.2.2",
    "groq>=1.6.0",
    "edge-tts>=7.2.8",
    "huggingface-hub>=1.26.0",
    "speechrecognition>=3.17.0",
    "cachetools>=5.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "ruff>=0.3.3",
]

# --- START MODIFICATION ---
# Empty services/__init__.py (SageMaker commit) makes this a package; Ruff N999
# then rejects the parenthesized legacy filename. Keep the file for reference
# but keep it out of the lint gate entirely.
[tool.ruff]
exclude = ["src/services/aws_voice(oldIssues).py"]
# --- END MODIFICATION ---

[tool.ruff.lint.per-file-ignores]
# Ignore legacy/template patterns in source and script code
"**/*.py" = ["BLE001", "B008", "I001", "TRY401", "ASYNC230"]
