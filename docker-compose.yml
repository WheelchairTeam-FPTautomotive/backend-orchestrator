# Docker Compose — local same-box stack (gateway + Core).
# VieNeu is NOT in Compose; on EC2 use systemd vieneu.service (see docs/DEPLOY_EC2.md).
#
# Usage:
#   cp .env.example .env
#   cp ../kms-core-ai/.env.example ../kms-core-ai/.env   # edit for local Acc freeze or Bedrock
#   docker compose up --build
#
# STM: gateway CMD pins --workers 1 (do not raise).

services:
  backend-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kms-backend-orchestrator
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Compose DNS overrides same-box 127.0.0.1 from .env.example
      CORE_AI_URL: "http://kms-core-ai:8001/api/v1/search"
    networks:
      - kms-network
    depends_on:
      kms-core-ai:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  kms-core-ai:
    container_name: kms-core-ai
    build:
      context: ../kms-core-ai
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    # --- START MODIFICATION ---
    # Core uses its own env (Bedrock/Chroma), not the gateway .env
    env_file:
      - ../kms-core-ai/.env
    # --- END MODIFICATION ---
    volumes:
      - ../kms-core-ai/data:/app/data
    networks:
      - kms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  kms-network:
    driver: bridge
    name: kms-network
