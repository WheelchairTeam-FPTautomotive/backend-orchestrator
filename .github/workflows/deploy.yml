name: CD

# Local-first CD: build the orchestrator image on the runner (no AWS).
# GHCR publish remains in orchestrator_ci.yml.
# AWS ECR + Terraform + Ansible/ECS path is commented below for later re-enable.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  local-image:
    name: Local image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image
        run: |
          docker build -t backend-orchestrator:local .
          docker images backend-orchestrator:local

