name: CD

# Deploys backend-orchestrator to AWS (ECR + Terraform + Ansible/ECS).
#
# Required GitHub Actions secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   ANSIBLE_VAULT_PASSWORD
# Optional:
#   AWS_REGION          (defaults to ap-southeast-2)
#   AWS_SESSION_TOKEN    (only for temporary STS credentials)
#
# When required secrets are missing, the deploy job is skipped so pushes to
# main stay green. Configure the secrets, then re-run via workflow_dispatch
# or push again to execute a real deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  TERRAFORM_DIR: ./terraform
  ANSIBLE_DIR: ./ansible
  DEFAULT_AWS_REGION: ap-southeast-2

jobs:
  skip-notice:
    name: CD prerequisites check
    runs-on: ubuntu-latest
    if: ${{ secrets.AWS_ACCESS_KEY_ID == '' || secrets.AWS_SECRET_ACCESS_KEY == '' || secrets.ANSIBLE_VAULT_PASSWORD == '' }}
    steps:
      - name: Report missing secrets
        run: |
          echo "::notice title=CD skipped::Configure repo secrets before deploy: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, ANSIBLE_VAULT_PASSWORD. Optional: AWS_REGION (default ap-southeast-2), AWS_SESSION_TOKEN."
          echo "CD skipped — required AWS/Ansible secrets are not configured."

  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' && secrets.ANSIBLE_VAULT_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve AWS region
        id: aws
        run: |
          REGION="${{ secrets.AWS_REGION }}"
          if [ -z "$REGION" ]; then
            REGION="${{ env.DEFAULT_AWS_REGION }}"
          fi
          echo "region=$REGION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (STS)
        if: ${{ secrets.AWS_SESSION_TOKEN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ steps.aws.outputs.region }}

      - name: Configure AWS credentials
        if: ${{ secrets.AWS_SESSION_TOKEN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.aws.outputs.region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: backend-orchestrator
          IMAGE_TAG: latest
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      # NOTE: This project uses a local Terraform backend by default. In CI,
      # the runner is ephemeral, so the local state file will not persist across
      # runs. For production CI/CD, migrate the backend to S3 (e.g., add a
      # backend "s3" block in terraform/backend.tf and set the bucket/key in
      # GitHub secrets). The workflow is otherwise ready to apply the
      # infrastructure and run the Ansible deployment.
      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform apply -auto-approve -input=false

      - name: Setup Python and Ansible
        run: |
          pip install ansible boto3 botocore
          ansible-galaxy collection install community.aws amazon.aws

      - name: Write Ansible Vault password
        run: |
          printf '%s' '${{ secrets.ANSIBLE_VAULT_PASSWORD }}' > /tmp/vault-pass
          chmod 600 /tmp/vault-pass

      - name: Deploy to ECS via Ansible
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          ANSIBLE_VAULT_PASSWORD_FILE: /tmp/vault-pass
          AWS_DEFAULT_REGION: ${{ steps.aws.outputs.region }}
        run: |
          ansible-playbook -i inventory/localhost.yml playbooks/deploy.yml

      - name: Cleanup Vault password
        if: always()
        run: rm -f /tmp/vault-pass
