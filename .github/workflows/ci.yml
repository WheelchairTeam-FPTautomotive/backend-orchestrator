name: CI

# Local-first CI (Docker Compose / image build). AWS Terraform + Ansible kept
# commented below for later re-enable.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  local-compose:
    name: Local Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare local env + sibling core-ai stub
        run: |
          cp .env.example .env
          mkdir -p ../kms-core-ai
          printf 'FROM python:3.12-slim\nCMD ["true"]\n' > ../kms-core-ai/Dockerfile

      - name: Validate Compose config
        run: docker compose config

      - name: Build orchestrator image (local)
        run: docker compose build backend-orchestrator

  # MODIFIED: permission-safe GPU IaC checks (no terraform apply / no AWS secrets)
  pseudo-gpu-iac:
    name: Pseudo SageMaker GPU IaC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible

      - name: Run pseudo GPU checks
        run: bash ./scripts/pseudo_gpu_check.sh

