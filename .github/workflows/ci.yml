name: CI

# DISABLED 2026-08-04: AWS-related CI (Terraform validate + Ansible/amazon.aws) paused.
# Re-enable later: (1) uncomment `push` / `pull_request` under `on:`, (2) remove `if: false` on both jobs.

on:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

jobs:
  validate:
    if: false  # DISABLED: remove this line to re-enable Terraform CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Format
        run: terraform fmt -check -diff

      - name: Terraform Init
        # Local/ephemeral runner — skip remote backend so validate stays offline-safe.
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  ansible-syntax:
    if: false  # DISABLED: remove this line to re-enable Ansible CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          pip install ansible boto3 botocore
          ansible-galaxy collection install community.aws amazon.aws

      - name: Ansible Syntax Check
        run: |
          cd ansible
          ansible-playbook -i inventory/localhost.yml playbooks/deploy.yml --syntax-check
