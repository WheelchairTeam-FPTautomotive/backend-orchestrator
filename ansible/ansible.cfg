[defaults]
# Use the local inventory file by default.
inventory = inventory/localhost.yml

# Search for roles in the local ./roles directory.
roles_path = ./roles

# Do not create .retry files on failure.
retry_files_enabled = False

# Disable host key checking because we are calling AWS APIs, not SSH targets.
host_key_checking = False

# Optional: point to a file containing the Ansible Vault password.
# For interactive use, omit this line and run the playbook with --ask-vault-pass.
# vault_password_file = .vault_pass

[privilege_escalation]
# No privilege escalation is required for local AWS API calls.
become = False
