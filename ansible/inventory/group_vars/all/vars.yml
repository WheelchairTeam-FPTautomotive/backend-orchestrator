# AWS region for locked EC2 + Bedrock path (Sydney).
aws_region: ap-southeast-2

# Windows binary names used inside WSL (PowerShell is the primary shell; Terraform
# and AWS CLI are installed on Windows, while Ansible runs in WSL).
terraform_command: terraform.exe
aws_cli_command: aws.exe

# Path to the Terraform workspace relative to the playbook.
terraform_dir: "{{ playbook_dir }}/../../terraform"

# Health check settings for the deployed service.
health_check_path: /api/v1/health
health_check_retries: 15
health_check_delay: 5

# Service stabilization polling settings.
service_stabilization_retries: 20
service_stabilization_delay: 5

# Locked Bedrock answer model (verify inference profile in Console if invoke fails).
bedrock_model_id: nvidia.nemotron-super-3-120b
