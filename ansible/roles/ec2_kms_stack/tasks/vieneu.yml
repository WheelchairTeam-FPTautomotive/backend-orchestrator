---
- name: Ensure VieNeu system user
  ansible.builtin.user:
    name: "{{ vieneu_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ vieneu_workdir }}"
    create_home: true

- name: Install vieneu.service
  ansible.builtin.template:
    src: vieneu.service.j2
    dest: /etc/systemd/system/vieneu.service
    mode: "0644"
  notify: Reload systemd

- name: Enable and start VieNeu
  ansible.builtin.systemd:
    name: vieneu.service
    enabled: true
    state: started
    daemon_reload: true
