---
- name: Install base packages (always)
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - tmux
      - python3
      - python3-pip
      - python3-venv
      - rsync
      - build-essential
    state: present
    update_cache: true
  when: ansible_facts['os_family'] | default('Debian') == "Debian"

- name: Install Docker packages (Method B — Compose only)
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true
  when:
    - use_docker_compose | bool
    - ansible_facts['os_family'] | default('Debian') == "Debian"

- name: Ensure Docker started (Method B)
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when: use_docker_compose | bool

- name: Create install directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ kms_service_user }}"
    group: "{{ kms_service_user }}"
    mode: "0755"
  loop:
    - "{{ kms_install_root }}"
    - "{{ kms_gateway_dir }}"
    - "{{ kms_core_dir }}"
    - "{{ kms_env_dir }}"
    - "{{ vieneu_workdir }}"

- name: Sync gateway tree from control node
  ansible.builtin.synchronize:
    src: "{{ kms_gateway_src }}/"
    dest: "{{ kms_gateway_dir }}/"
    delete: false
    rsync_opts:
      - "--exclude=.venv"
      - "--exclude=__pycache__"
      - "--exclude=.git"
      - "--exclude=terraform/.terraform"
  become: false
  when: kms_gateway_src | length > 0

- name: Sync Core AI tree from control node
  ansible.builtin.synchronize:
    src: "{{ kms_core_src }}/"
    dest: "{{ kms_core_dir }}/"
    delete: false
    rsync_opts:
      - "--exclude=.venv"
      - "--exclude=__pycache__"
      - "--exclude=.git"
  become: false
  when: kms_core_src | length > 0

- name: Fix CRLF on shell scripts after Windows sync
  ansible.builtin.shell: |
    find "{{ kms_gateway_dir }}/scripts" "{{ kms_core_dir }}/scripts" \
      -name '*.sh' -exec sed -i 's/\r$//' {} \; 2>/dev/null || true
  args:
    executable: /bin/bash
  changed_when: false
  when: kms_gateway_src | length > 0 or kms_core_src | length > 0
