---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - tmux
      - python3
      - python3-pip
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Ensure Docker started
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Create install directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ kms_install_root }}"
    - "{{ kms_gateway_dir }}"
    - "{{ kms_core_dir }}"
    - "{{ kms_env_dir }}"
    - "{{ vieneu_workdir }}"

- name: Sync gateway tree from control node
  ansible.builtin.synchronize:
    src: "{{ kms_gateway_src }}/"
    dest: "{{ kms_gateway_dir }}/"
    delete: false
    rsync_opts:
      - "--exclude=.venv"
      - "--exclude=__pycache__"
      - "--exclude=.git"
  when: kms_gateway_src | length > 0

- name: Sync Core AI tree from control node
  ansible.builtin.synchronize:
    src: "{{ kms_core_src }}/"
    dest: "{{ kms_core_dir }}/"
    delete: false
    rsync_opts:
      - "--exclude=.venv"
      - "--exclude=__pycache__"
      - "--exclude=.git"
  when: kms_core_src | length > 0
