---
- name: Install gateway env from sample (no overwrite if exists)
  ansible.builtin.copy:
    src: "{{ gateway_env_sample }}"
    dest: "{{ kms_env_dir }}/gateway.env"
    mode: "0640"
    force: false

- name: Install Core env from sample (no overwrite if exists)
  ansible.builtin.copy:
    src: "{{ core_env_sample }}"
    dest: "{{ kms_env_dir }}/core.env"
    mode: "0640"
    force: false

- name: Ensure locked Core Bedrock + Chroma keys present
  ansible.builtin.lineinfile:
    path: "{{ kms_env_dir }}/core.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: "LLM_PROVIDER", value: "bedrock" }
    - { key: "BEDROCK_MODEL_ID", value: "{{ bedrock_model_id }}" }
    - { key: "AWS_REGION", value: "{{ aws_region }}" }
    - { key: "VECTOR_DB_TYPE", value: "chroma" }

- name: Ensure locked gateway VieNeu + Core URL
  ansible.builtin.lineinfile:
    path: "{{ kms_env_dir }}/gateway.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: "CORE_AI_URL", value: "http://127.0.0.1:{{ kms_core_port }}/api/v1/search" }
    - { key: "VIENEU_TTS_URL", value: "http://127.0.0.1:{{ vieneu_port }}/v1/audio/speech" }
    - { key: "AWS_REGION", value: "{{ aws_region }}" }

- name: Symlink env files into app trees for Compose
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: "{{ kms_env_dir }}/gateway.env", dest: "{{ kms_gateway_dir }}/.env" }
    - { src: "{{ kms_env_dir }}/core.env", dest: "{{ kms_core_dir }}/.env" }
