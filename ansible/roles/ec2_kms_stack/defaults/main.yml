---
# Locked one-EC2 KMS stack defaults (Acc→Lat→Budget).
kms_install_root: /opt/kms
kms_gateway_dir: "{{ kms_install_root }}/backend-orchestrator"
kms_core_dir: "{{ kms_install_root }}/kms-core-ai"
kms_env_dir: /etc/kms
kms_gateway_port: 8000
kms_core_port: 8001
vieneu_port: 8022

# Repo sync: set to local checkout paths on the control machine (synchronize).
# Leave empty to skip sync (code already on host).
kms_gateway_src: ""
kms_core_src: ""

bedrock_model_id: nvidia.nemotron-super-3-120b
aws_region: ap-southeast-2
enable_ollama_fallback: false
ollama_model: qwen2.5:7b-instruct

# Use Docker Compose for gateway+Core (recommended). VieNeu always systemd.
use_docker_compose: true

# VieNeu binary/command — override for your install layout.
vieneu_user: vieneu
vieneu_workdir: "{{ kms_install_root }}/vieneu"
vieneu_exec_start: "/usr/bin/env vieneu-server --host 127.0.0.1 --port {{ vieneu_port }}"
vieneu_enabled: true

gateway_env_sample: "{{ playbook_dir }}/../../docs/env-samples/prod.gateway.env.sample"
core_env_sample: "{{ playbook_dir }}/../../docs/env-samples/prod.core.env.sample"
