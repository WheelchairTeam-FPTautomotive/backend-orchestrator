---
# Safe defaults for the sagemaker_model_deploy role.
# Override these via inventory variables, group_vars, or command-line extra-vars.

# SageMaker model configuration
sagemaker_model_id: "TheBloke/Mistral-7B-Instruct-v0.2-AWQ"
sagemaker_model_slug: "{{ sagemaker_model_id | split('/') | last | regex_replace('[^0-9a-zA-Z]', '-') | lower }}"
sagemaker_container_image: "763104351884.dkr.ecr.ap-southeast-2.amazonaws.com/huggingface-vllm:0.25.1-transformers5.10-gpu-py312-cu130-ubuntu22.04"
sagemaker_instance_type: "ml.g4dn.xlarge"
sagemaker_instance_type_family: "{{ sagemaker_instance_type.split('.')[1] }}"

# S3 configuration (filled from Terraform outputs in the playbook)
sagemaker_model_bucket: "backend-orchestrator-models-808454010747"
sagemaker_model_s3_key: "models/{{ sagemaker_model_slug }}/model.tar.gz"

# Local staging for the model download and tarball
sagemaker_model_local_dir: "{{ playbook_dir }}/../../.tmp/sagemaker_model"
sagemaker_model_tarball: "{{ sagemaker_model_local_dir }}/model.tar.gz"

# Endpoint health-check polling
sagemaker_endpoint_wait_retries: 60
sagemaker_endpoint_wait_delay: 30

# AWS / Terraform paths and commands
aws_region: "ap-southeast-2"
terraform_dir: "{{ playbook_dir }}/../../terraform"
terraform_command: terraform.exe
aws_cli_command: aws.exe

# Pre-existing SageMaker execution role ARN.
# Terraform will create the role only when this is left empty. Because the
# hackathon IAM user lacks iam:CreateRole, provide an ARN here.
sagemaker_execution_role_arn: ""

# Teardown confirmation guard
sagemaker_allow_teardown: true
