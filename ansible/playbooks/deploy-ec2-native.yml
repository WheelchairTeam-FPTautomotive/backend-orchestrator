---
# Method A (recommended for single EC2): native systemd + uv venv.
# No Docker on the box. Acc→Lat→Budget lock.
- name: Deploy KMS on EC2 — native systemd
  hosts: kms_ec2
  become: true
  gather_facts: "{{ gather_facts | default(true) | bool }}"
  vars:
    deploy_method: native
    use_docker_compose: false
    teardown_docker: true
    vieneu_enabled: true
    kms_gateway_src: "{{ playbook_dir }}/../.."
    kms_core_src: "{{ playbook_dir }}/../../../kms-core-ai"

  roles:
    - role: "{{ playbook_dir }}/../roles/ec2_kms_stack"
